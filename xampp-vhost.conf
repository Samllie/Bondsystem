# Add this block to C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Hosts entry: 127.0.0.1 sici-bonds.local  (run add-hosts-entry.ps1 as Administrator)
# Restart Apache in XAMPP, then open http://sici-bonds.local

<VirtualHost *:80>
    DocumentRoot "C:/projects/Bondsystem/public"
    ServerName sici-bonds.local
    <Directory "C:/projects/Bondsystem/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
