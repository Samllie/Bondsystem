# Add this block to C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Hosts entry: 127.0.0.1 sici-bonds.local  (run add-hosts-entry.ps1 as Administrator)
# HTTPS setup: run scripts/setup-xampp-https.ps1 as Administrator, restart Apache
# Then open https://sici-bonds.local

<VirtualHost *:80>
    ServerName sici-bonds.local
    Redirect permanent / https://sici-bonds.local/
</VirtualHost>
