# Add this block to C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Hosts entry (done): 127.0.0.1 bondsystem.test
# Restart Apache in XAMPP, then open http://bondsystem.test

<VirtualHost *:80>
    DocumentRoot "C:/projects/Bondsystem/public"
    ServerName bondsystem.test
    <Directory "C:/projects/Bondsystem/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
