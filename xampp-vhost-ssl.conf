# HTTPS virtual host for sici-bonds.local
# Include from C:\xampp\apache\conf\extra\httpd-ssl.conf (see scripts/setup-xampp-https.ps1)

<VirtualHost *:443>
    DocumentRoot "C:/projects/Bondsystem/public"
    ServerName sici-bonds.local

    SSLEngine on
    SSLCertificateFile "C:/projects/Bondsystem/storage/certs/local/server.crt"
    SSLCertificateKeyFile "C:/projects/Bondsystem/storage/certs/local/server.key"

    <Directory "C:/projects/Bondsystem/public">
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "C:/xampp/apache/logs/sici-bonds.local-ssl-error.log"
    CustomLog "C:/xampp/apache/logs/sici-bonds.local-ssl-access.log" combined
</VirtualHost>
